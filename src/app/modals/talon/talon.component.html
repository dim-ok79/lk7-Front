<div class="modal-header">
  <ng-container [ngSwitch]="typeTalon">
    <ng-template [ngSwitchCase]="0">
      <h4 class="modal-title">Информация о талоне</h4>
    </ng-template>
  </ng-container>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss('Cross click')"></button>
</div>

<div class="modal-body">
  <div class="cls-doc row">
    <div class="col-sm-4" style="height: 100%">
      <img [src]="imgS.getImgSrcDoc(talon()?.doctor_id)" (error)="imgS.errorHandlerIMG($event, 'doc')" height="100%" width="auto">
    </div>

    <div class="cls-doc-info col-sm-4">
      <div class="cls-doc-fio">{{getFIODoc(talon())}}</div>
      <div class="cls-doc-spec">{{talon().spec}}
      </div>
    </div>

    <div class="cls-doc-time col-sm-4">
      <div class="cls-date">{{getTalonDateTime(talon().beginDate)}}</div>
      <div class="cls-day">{{getNameDay(talon().beginDate)}}</div>
    </div>

  </div>

  <div class="cls-talon-adress">
    <div class="cls-priem">Прием врача по адресу:</div>
    <div class="cls-info row">
      <div class="cls-info-adr col-8">{{talon().addr}}
        <mat-icon svgIcon="location" class="btn-icon-location"></mat-icon>
      </div>
      <div class="cls-info-phone col-4">{{talon().phone}}</div>
    </div>
  </div>

</div>

<div class="modal-footer">
  <app-btn class="app-btn-filter"
           text="Закрыть"
           (click)="activeModal.close('Close click')">
  </app-btn>

<!--  <button type="button" class="btn btn-outline-dark" (click)="activeModal.close('Close click')">Закрыть</button>-->
</div>
