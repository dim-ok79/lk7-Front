<div>ВХОД В ЛИЧНЫЙ КАБИНЕТ</div>
<app-panel-table-pagination nameBlock="" (onChangePeriod)="changePeriod($event)"
                            [dtBegin]="dtBegin"
                            [dtEnd]="dtEnd"
                            textItogo="входов"
                            [CountRec]="patientLogsCountRec()"
                            [CountRecPage]="patientLogsCountRectoPage"
                            (onChangedPage)="changedPage($event)"
                            class="loading-group"
>

<!--
  <div *ngIf="loading()" class="loading"><img src="./assets/loading.gif" alt="Загрузка..."></div>
-->

  <ng-container *ngIf="patientLogsCountRec()>0; then showTable else showNotRec"></ng-container>

  <ng-template #showNotRec>
    <div class="cls-not-rec"> Нет входов</div>
  </ng-template>

  <ng-template #showTable>
    <div *ngIf="loading()" class="loading"><img src="./assets/loading.gif" alt="Загрузка..."></div>
    <table class="table table-borderless table-hover">
      <thead>
      <tr>
        <th scope="col" class="app-bg-color cls-header-table-dt" style="width: 10%;">Дата и время</th>
        <th scope="col" class="app-bg-color" style="width: 55%;">Событие</th>
        <th scope="col" class="app-bg-color" style="width: 10%;">Информация</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let log of patientLogs">
        <td class="cls-td-yeer">{{getDateTime(log.date)}}</td>
        <td class="cls-td-yeer">{{log.text}}</td>
        <td class="cls-td-yeer">
          <ng-template #tipContent let-greeting="greeting">OS: {{log.os}} Браузер: {{log.browser}} IP адрес:{{log.ip_address}}</ng-template>
          <mat-icon svgIcon="logInfo" class="cls-mat-icon cls-mat-icon-info" placement="left" [ngbTooltip]="tipContent" tooltipClass="tooltipPanel"></mat-icon>
        </td>
      </tr>

      <!--
          <ng-container *ngFor="let serv of servicesList;let i = index">
            <tr *ngIf="isBlockYear(i);">
              <td colspan="6" class="cls-td-yeer">{{getYear(i)}}</td>
            </tr>
          </ng-container>
      -->
      </tbody>
    </table>

  </ng-template>
</app-panel-table-pagination>
