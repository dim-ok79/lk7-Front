<div class="cls-panel cls-ptp panel-table-pagination" [ngClass]="{ 'panel-table-pagination-not-date': HeaderHide}">

    <div class="cls-ptp-header panel-table-pagination__header" *ngIf="HeaderHide == false">
        <span class="cls-name">{{nameBlock}}</span>
        <span  class="cls-date">
      <app-date-range [dtBegin]="dtBegin" [dtEnd]="dtEnd" (onChanged)="onChangedPeriod($event)"></app-date-range>
    </span>

    </div>

    <div class="cls-ptp-body panel-table-pagination__body">

      <ng-container *ngIf="textNotREC; then showInfo else showNotInfo"></ng-container>
      <ng-template #showInfo>
        <ng-container *ngIf="CountRec>0; then showTable else showNotRec"></ng-container>

        <ng-template #showNotRec>
          <div class="cls-not-rec">{{textNotREC}}</div>
        </ng-template>

        <ng-template #showTable>
<!--          <p>Табличка</p>-->
          <ng-container *ngTemplateOutlet="linkTemplate"></ng-container>
        </ng-template>

      </ng-template>

      <ng-template #showNotInfo>
        <ng-container *ngTemplateOutlet="linkTemplate"></ng-container>
      </ng-template>

      <ng-template #linkTemplate>
        <ng-content></ng-content>
      </ng-template>

    </div>

    <div class="cls-ptp-footer panel-table-pagination__footer">
        <app-pagination
          [currentPage]="1"
          [countRecPage]="CountRecPage"
          [countRec]="CountRec"
          [textItogo]="textItogo"
          [textItogoStrEnd]="textItogoStrEnd"
          *ngIf="CountRec>0"
          (onChangedPage)="changedPage($event)">

        </app-pagination>
    </div>

</div>
