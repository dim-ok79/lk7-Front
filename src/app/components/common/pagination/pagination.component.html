<div class="cls-pg-itogo" *ngIf="isShowTextItogo()">{{_countRec}} {{getTextItogo()}}</div>
<ul class="cls-pagination" *ngIf="countPage>0">
  <li class="cls-pag-first" (click)="prevPage()"> < </li>

  <ng-container *ngFor="let page of arrayPage ; let i = index">
    <li [ngClass]="{ 'active': page.num==currentPage}" (click)="goPage(page.num)">{{page.name}}</li>
  </ng-container>

  <li class="cls-pag-next" (click)="nextPage()"> > </li>

</ul>
