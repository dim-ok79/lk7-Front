<app-loading [loading]="loading()"></app-loading>
<ng-container *ngIf="isMobile; then showMobile else showPC"></ng-container>

<ng-template #showMobile >
  <br>
  <app-block-doc *ngFor="let document of documentList()"
                 infoName="{{document.text}} - {{document.file_name}}"
                 [infoDate]="document.dat"
                 [semd_id]="document.id"]></app-block-doc>
</ng-template>

<ng-template #showPC>
  <app-panel-table-pagination nameBlock=""
                              textItogo=""
                              [HeaderHide] = "true"
                              [CountRec]="documentCountRec()"
                              [HeightBlock]="testHeightBlock"
                              [CountRecPage]="documentCountRectoPage"
                              (onChangedPage)="changedPage($event)"
  >

      <div class="tableFixHead">
        <table class="table table-borderless table-hover table-fixed">
          <thead>
          <tr>
            <th scope="col" class="app-bg-color app-header-table-dt app-table-th-center">Дата</th>
            <th scope="col" class="app-bg-color app-table-th-center">Название и тип</th>
            <th scope="col" class="app-bg-color app-table-th-center">Документ</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let document of documentList()">
            <td class="app-table-th-center">
              {{UtilsS.getTekDayDATE(document.dat)}}
            </td>
            <td class="logout-td-text">{{document.text}} - {{document.file_name}}</td>
            <td class="app-table-th-center">
              <mat-icon svgIcon="pdf" class="app-icon-info80"
                        (click)="openDoc(document.id)">

              </mat-icon>
            </td>

          </tr>

          </tbody>
        </table>
      </div>

  </app-panel-table-pagination>
</ng-template>
