<app-panel-table-pagination nameBlock="" (onChangePeriod)="changePeriod($event)"
                            [dtBegin]="dtBegin"
                            [dtEnd]="dtEnd"
                            textItogo=""
                            [CountRec]="findingCountRec()"
                            [CountRecPage]="findingCountRectoPage"
                            (onChangedPage)="changedPage($event)">

    <div class="tableFixHead" [style.max-height.px]="testHeightBlock">
      <table class="table table-borderless table-hover table-fixed">
        <thead>
        <tr>
          <th scope="col" class="app-bg-color cls-header-table-dt logout-td-yeer">Дата</th>
          <th scope="col" class="app-bg-color app-table-th-center">Название</th>
          <th scope="col" class="app-bg-color app-table-th-center">Документ</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let finding of findingList()">
          <td class="app-table-th-center">
            {{UtilsS.getTekDayDATE(finding.dat_date)}}
          </td>
          <td class="logout-td-text">{{finding.text}}</td>
          <td class="app-table-th-center">
            <mat-icon svgIcon="pdf" class="cls-mat-icon cls-mat-icon-info app-icon-info"
                      (click)="SemdS.onClickSEMD(finding.semd_id)">

            </mat-icon>
          </td>
        </tr>

        </tbody>
      </table>
      <!--      (click)="onClickOrder(lab.research_id)"-->
    </div>

</app-panel-table-pagination>
