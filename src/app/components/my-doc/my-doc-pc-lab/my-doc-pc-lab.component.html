<app-panel-table-pagination nameBlock="" (onChangePeriod)="changePeriod($event)"
                            [dtBegin]="dtBegin"
                            [dtEnd]="dtEnd"
                            textItogo=""
                            [CountRec]="labCountRec()"
                            [CountRecPage]="labCountRectoPage"
                            (onChangedPage)="changedPage($event)">
    <div class="tableFixHead" [style.max-height.px]="testHeightBlock">
      <table class="table table-borderless table-hover table-fixed">
        <thead>
        <tr>
          <th scope="col" class="app-bg-color app-header-table-dt app-table-th-center" >Дата посещения</th>
          <th scope="col" class="app-bg-color app-table-th-center">Название</th>
          <th scope="col" class="app-bg-color app-table-th-center">Документы</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let lab of labList()">
          <td class="app-table-th-center">
            {{UtilsS.getTekDayDATE(lab.dtSort)}}
          </td>
          <td class="logout-td-text">Заказ № {{lab.orderid}} - {{lab.text_status}}
          </td>

<!--          (click)="test(lab.research_id)"-->

          <td class="app-table-th-center">
            <mat-icon svgIcon="pdf" class="cls-mat-icon cls-mat-icon-info app-icon-info"
                                  (click)="LabServiceS.openResearchPdf(lab.research_id)"
            >

            </mat-icon>
          </td>
        </tr>

        </tbody>
      </table>
<!--      (click)="onClickOrder(lab.research_id)"-->
    </div>

</app-panel-table-pagination>
